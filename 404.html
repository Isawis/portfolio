<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ '/css/Root.css' | url }}">
  <link rel="stylesheet" href="{{ '/css/style.css' | url }}">
  <link rel="stylesheet" href="{{ '/css/boilerstyle.css' | url }}">
  <link rel="stylesheet" href="{{ '/css/Textstyles.css' | url }}">
  <link rel="stylesheet" href="{{ '/css/responsive.css' | url }}">

  <script src="https://kit.fontawesome.com/9bbb0a7972.js" crossorigin="anonymous"></script>

  <title>Page Not Found | Isa Molinder</title>
  <meta name="description" content="The page you were looking for could not be found.">

  <link rel="icon" href="{{ '/img/ha-cat.png' | url }}" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>

<body class="not-found-page">
  <script src="{{ '/js/app.js' | url }}"></script>
  <a class="skip-link" href="#main">Skip to main content</a>

  {% include "header.njk" %}

  <main id="main">
    <div class="not-found-container">
        <h1>Page not found</h1>
        <p>Sorry, I haven't created the page you're looking for. Or perhaps I moved it. Mystery!</p>

        <img src="{{ '/img/basse-idle.gif' | url }}"
          alt="A doodled gif cat that crankily moves its tail and has a very, very grumpy face. Basse is angry.">
          <br>
        <a class="not-found-link" href="{{ '/' | url }}">Return to the portfolio</a>
    </div>
  </main>

  <footer>
    <p><span id="year"></span> Isa Molinder. All rights reserved.</p>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </footer>
</body>

</html>
